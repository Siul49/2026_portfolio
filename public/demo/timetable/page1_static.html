<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임테이블 페이지 1 - 정적</title>
  <link rel="stylesheet" href="css/style.css">
  <link
    rel="stylesheet"
    href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
  >
  <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body class="tt-page">
  <main class="tt-shell">
    <header class="tt-topbar">
      <div class="tt-topbar__group">
        <button type="button" onclick="location.reload();" class="tt-chip tt-chip--accent">
          타임테이블 페이지
        </button>
        <a href="page1_dynamic.html" class="tt-chip tt-chip--blue">동적으로 보기</a>
      </div>
      <p class="tt-topbar__hint">
        정적 버전도 동일한 정보 구조를 유지하면서 작은 화면에서는 세로로 자연스럽게 쌓이도록 수정했습니다.
      </p>
    </header>

    <section class="tt-shell-card">
      <div class="tt-stage tt-stage--page1">
        <section class="tt-panel tt-panel--olive tt-panel--people">
          <div class="tt-panel__bar">전체 인원 수 / 팀 당 인원 수</div>
          <div class="tt-panel__body">
            <div class="tt-static-grid">
              <div class="tt-static-group">
                <p class="tt-label">전체 인원</p>
                <div class="tt-input-inline">
                  <input
                    type="text"
                    maxlength="3"
                    value="100"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="tt-digit-input tt-static-field"
                  >
                  <span class="tt-suffix">명</span>
                </div>
              </div>

              <div class="tt-static-group">
                <p class="tt-label">팀 당 인원</p>
                <div class="tt-input-inline">
                  <input
                    type="text"
                    maxlength="1"
                    value="5"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="tt-digit-input"
                  >
                  <span class="tt-suffix">명씩</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="tt-side-actions">
          <a href="page2.html" class="tt-hero-button">※ 다음으로 ※</a>
          <div class="tt-small-actions">
            <div class="tt-info-card tt-info-card--lavender">
              <span class="tt-label">Team</span>
              <strong>3조</strong>
            </div>
            <button type="button" onclick="openModal()" class="tt-info-card tt-info-card--muted">
              <span class="tt-label">Guide</span>
              <strong>제작자 코멘트</strong>
            </button>
          </div>
        </div>

        <section class="tt-panel tt-panel--pink tt-panel--calendar">
          <div class="tt-panel__bar">시작일 / 기간</div>
          <div class="tt-panel__body">
            <div class="tt-static-grid">
              <div class="tt-static-group">
                <p class="tt-label">시작일</p>
                <div class="tt-input-inline">
                  <input
                    type="text"
                    maxlength="2"
                    value="10"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="tt-digit-input"
                  >
                  <span class="tt-suffix">일부터</span>
                </div>
              </div>

              <div class="tt-static-group">
                <p class="tt-label">기간</p>
                <div class="tt-input-inline">
                  <input
                    type="text"
                    maxlength="1"
                    value="5"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="tt-digit-input"
                  >
                  <span class="tt-suffix">일간</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="tt-panel tt-panel--blue tt-panel--time">
          <div class="tt-panel__bar">시작 시간 / 종료 시간 / 팀 당 배정 시간</div>
          <div class="tt-panel__body">
            <div class="tt-input-row">
              <div class="tt-static-group">
                <p class="tt-label">시작 시간</p>
                <input
                  type="text"
                  maxlength="4"
                  value="0100"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                  class="tt-digit-input tt-time-field"
                >
              </div>

              <div class="tt-static-group">
                <p class="tt-label">종료 시간</p>
                <input
                  type="text"
                  maxlength="4"
                  value="2300"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                  class="tt-digit-input tt-time-field"
                >
              </div>

              <div class="tt-static-group">
                <p class="tt-label">배정 간격</p>
                <div class="tt-input-inline">
                  <input
                    type="text"
                    maxlength="2"
                    value="15"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="tt-digit-input"
                  >
                  <span class="tt-suffix">분</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="modal-sub" class="tt-modal-backdrop hidden">
    <div class="tt-submodal-card">
      <p id="submodal-ContentText">작은 모달창입니다.</p>
      <div class="tt-submodal-actions">
        <button type="button" onclick="lastStep()">&lt;- 이전으로</button>
        <button type="button" onclick="nextStep()">다음으로 -&gt;</button>
      </div>
    </div>
  </div>

  <div id="modal" class="tt-modal-backdrop hidden">
    <div class="tt-modal-card tt-modal-card--wide">
      <div class="tt-modal-header">
        <p id="modal-mainText">개발자 코멘트</p>
        <button type="button" onclick="closeModal()" class="tt-close-btn">
          <img src="../../resource/close.svg" alt="닫기">
        </button>
      </div>

      <div class="tt-modal-body tt-modal-body--split">
        <div id="modal-Code" class="tt-modal-code">
          <pre><code></code></pre>
        </div>
        <div class="tt-modal-text">
          <p id="modal-ContentText">코드 설명 부분입니다.</p>
        </div>
      </div>

      <div class="tt-modal-actions">
        <button type="button" onclick="lastStep()" class="tt-modal-button last-button">이전으로</button>
        <button type="button" onclick="nextStep()" class="tt-modal-button next-button">다음으로</button>
      </div>
    </div>
  </div>

  <script src="js/web-study.js"></script>
</body>
</html>
