<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임테이블 페이지 2</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/timetable_maker/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body class="tt-page">
  <main class="tt-shell">
    <header class="tt-topbar">
      <div class="tt-topbar__group">
        <button type="button" onclick="location.reload();" class="tt-chip tt-chip--accent">
          타임테이블 페이지
        </button>
        <button type="button" onclick="history.back();" class="tt-chip tt-chip--blue">
          이전 단계
        </button>
      </div>
      <p class="tt-topbar__hint">
        CSV를 올린 뒤 생성하기를 누르면 시간표 HTML 파일이 다운로드됩니다.
      </p>
    </header>

    <section class="tt-shell-card">
      <div class="tt-stage tt-stage--page2">
        <label class="tt-panel tt-panel--pink tt-upload-surface">
          <input type="file" id="csvInput" accept=".csv" class="tt-file-input">
          <span class="tt-label">CSV Upload</span>
          <strong>드래그하거나 클릭해서<br>CSV 파일을 첨부하기</strong>
          <p>학생 이름, 개인번호, 가능 시간대가 담긴 CSV 파일을 업로드하세요.</p>
        </label>

        <div class="tt-page2-side">
          <button type="button" id="processBtn" class="tt-hero-button">※ 생성하기 ※</button>

          <section class="tt-panel tt-panel--neutral">
            <div class="tt-panel__bar">설명</div>
            <div class="tt-panel__body">
              <p>
                업로드한 CSV를 바탕으로 가능한 시간표를 계산한 뒤,
                결과를 별도의 HTML 파일로 저장합니다.
              </p>
              <ul class="tt-bullet-list">
                <li>1. 먼저 CSV 파일을 업로드합니다.</li>
                <li>2. 생성하기 버튼을 눌러 시간표를 계산합니다.</li>
                <li>3. 결과가 담긴 HTML 파일을 내려받아 확인합니다.</li>
              </ul>
            </div>
          </section>

          <div class="tt-inline-actions">
            <button type="button" onclick="openModal()" class="tt-action-btn tt-action-btn--muted">
              제작자 코멘트
            </button>
            <button type="button" onclick="history.back()" class="tt-action-btn tt-action-btn--blue">
              이전으로
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="tt-modal-backdrop hidden">
    <div class="tt-modal-card">
      <div class="tt-modal-header">
        <p id="modal-mainText">개발자 코멘트</p>
        <button type="button" onclick="closeModal()" class="tt-close-btn">
          <img src="../../resource/close.svg" alt="닫기">
        </button>
      </div>

      <div class="tt-modal-body">
        <div class="tt-modal-text">
          <p id="modal-ContentText">코드 설명 부분입니다.</p>
        </div>
      </div>

      <div class="tt-modal-actions">
        <button type="button" onclick="lastStep()" class="tt-modal-button last-button">이전으로</button>
        <button type="button" onclick="nextStep()" class="tt-modal-button next-button">다음으로</button>
      </div>
    </div>
  </div>

  <script src="js/comment_modal.js"></script>
</body>
</html>
