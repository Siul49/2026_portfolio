<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임테이블 페이지 1 - 동적</title>
  <link rel="stylesheet" href="css/style.css">
  <link
    rel="stylesheet"
    href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
  >
  <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body class="tt-page">
  <main class="tt-shell">
    <header class="tt-topbar">
      <div class="tt-topbar__group">
        <button type="button" onclick="location.reload();" class="tt-chip tt-chip--accent">
          타임테이블 페이지
        </button>
        <a href="page1_static.html" class="tt-chip tt-chip--blue">정적으로 보기</a>
      </div>
      <p class="tt-topbar__hint">
        원래의 absolute 중심 배치를 화면 크기에 따라 다시 정리한 반응형 데모입니다.
      </p>
    </header>

    <section class="tt-shell-card">
      <div class="tt-stage tt-stage--page1">
        <section class="tt-panel tt-panel--olive tt-panel--people">
          <div class="tt-panel__bar">전체 인원 / 팀 당 인원</div>
          <div class="tt-panel__body">
            <div class="tt-number-board tt-number-board--split">
              <div class="tt-number-section">
                <p class="tt-label">전체 인원</p>
                <div class="tt-digit-row">
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="전체 인원 백의 자리 증가">
                    </button>
                    <span id="totalPeople100" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="전체 인원 백의 자리 감소">
                    </button>
                  </div>
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="전체 인원 십의 자리 증가">
                    </button>
                    <span id="totalPeople10" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="전체 인원 십의 자리 감소">
                    </button>
                  </div>
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="전체 인원 일의 자리 증가">
                    </button>
                    <span id="totalPeople1" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="전체 인원 일의 자리 감소">
                    </button>
                  </div>
                  <span class="tt-suffix">명</span>
                </div>
              </div>

              <div class="tt-number-section">
                <p class="tt-label">팀 당 인원</p>
                <div class="tt-digit-row tt-digit-row--compact">
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="팀 당 인원 증가">
                    </button>
                    <span id="peoplePerTime" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="팀 당 인원 감소">
                    </button>
                  </div>
                  <span class="tt-suffix">명씩</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="tt-side-actions">
          <a href="page2.html" class="tt-hero-button">※ 다음으로 ※</a>
          <div class="tt-small-actions">
            <div class="tt-info-card tt-info-card--lavender">
              <span class="tt-label">Team</span>
              <strong>3조</strong>
            </div>
            <button type="button" onclick="openModal()" class="tt-info-card tt-info-card--muted">
              <span class="tt-label">Guide</span>
              <strong>제작자 코멘트</strong>
            </button>
          </div>
        </div>

        <section class="tt-panel tt-panel--pink tt-panel--calendar">
          <div class="tt-panel__bar">시작일 / 기간</div>
          <div class="tt-panel__body">
            <div class="tt-number-board tt-number-board--split">
              <div class="tt-number-section">
                <p class="tt-label">시작일</p>
                <div class="tt-digit-row">
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="시작일 십의 자리 증가">
                    </button>
                    <span id="whatDay10" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="시작일 십의 자리 감소">
                    </button>
                  </div>
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="시작일 일의 자리 증가">
                    </button>
                    <span id="whatDay1" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="시작일 일의 자리 감소">
                    </button>
                  </div>
                  <span class="tt-suffix">일부터</span>
                </div>
              </div>

              <div class="tt-number-section">
                <p class="tt-label">기간</p>
                <div class="tt-digit-row tt-digit-row--compact">
                  <div class="tt-digit-stack">
                    <button type="button" class="triangle-button digit-up-btn digitUp">
                      <img src="../../resource/uptriangle.png" alt="기간 증가">
                    </button>
                    <span id="days" class="tt-digit-display">0</span>
                    <button type="button" class="triangle-button digit-down-btn digitDown">
                      <img src="../../resource/downtriangle.png" alt="기간 감소">
                    </button>
                  </div>
                  <span class="tt-suffix">일간</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="tt-panel tt-panel--blue tt-panel--time">
          <div class="tt-panel__bar">시작 시간 / 종료 시간 / 팀 당 배정 시간</div>
          <div class="tt-panel__body">
            <div class="tt-slider-panel">
              <div class="tt-slider-caption">
                <p>슬라이더 핸들을 드래그해 시간 범위를 조정해보세요.</p>
              </div>

              <div class="tt-slider-track-wrap">
                <div class="tt-slider-track-helper">
                  <span>하루 시작</span>
                  <span>하루 종료</span>
                </div>
                <div id="sliderTrack" class="tt-slider-track">
                  <div id="sliderRange"></div>
                  <div id="sliderThumbMin" class="slider-thumb">
                    <span id="sliderMinLabel">00:00</span>
                  </div>
                  <div id="sliderThumbMax" class="slider-thumb">
                    <span id="sliderMaxLabel">24:00</span>
                  </div>
                </div>
              </div>

              <div class="tt-interval-block">
                <p class="tt-label">팀 당 배정 시간</p>
                <div class="tt-slider-controls">
                  <button type="button" id="intervalDecBtn" class="tt-icon-btn" aria-label="간격 줄이기">◀</button>
                  <span id="intervalNum" class="tt-pill-value">5</span>
                  <button type="button" id="intervalIncBtn" class="tt-icon-btn" aria-label="간격 늘리기">▶</button>
                  <span class="tt-suffix">분</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="modal-sub" class="tt-modal-backdrop hidden">
    <div class="tt-submodal-card">
      <p id="submodal-ContentText">작은 모달창입니다.</p>
      <div class="tt-submodal-actions">
        <button type="button" onclick="lastStep()">&lt;- 이전으로</button>
        <button type="button" onclick="nextStep()">다음으로 -&gt;</button>
      </div>
    </div>
  </div>

  <div id="modal" class="tt-modal-backdrop hidden">
    <div class="tt-modal-card tt-modal-card--wide">
      <div class="tt-modal-header">
        <p id="modal-mainText">개발자 코멘트</p>
        <button type="button" onclick="closeModal()" class="tt-close-btn">
          <img src="../../resource/close.svg" alt="닫기">
        </button>
      </div>

      <div class="tt-modal-body tt-modal-body--split">
        <div id="modal-Code" class="tt-modal-code">
          <pre><code></code></pre>
        </div>
        <div class="tt-modal-text">
          <p id="modal-ContentText">코드 설명 부분입니다.</p>
        </div>
      </div>

      <div class="tt-modal-actions">
        <button type="button" onclick="lastStep()" class="tt-modal-button last-button">이전으로</button>
        <button type="button" onclick="nextStep()" class="tt-modal-button next-button">다음으로</button>
      </div>
    </div>
  </div>

  <script src="js/slider.js"></script>
  <script src="js/buttonClick.js"></script>
  <script src="js/rememberPage.js"></script>
  <script src="js/web-study.js"></script>
</body>
</html>
